version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/e2e"]
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
