# Local stack: Qdrant + recommendation service.
#
#   docker compose up -d --build --wait     # or: make up
#   open http://localhost:8000/docs/
#
# Variables below can be set in the shell or in a `.env` file next to this file.

name: recommendation-service

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333" # REST + web UI (http://localhost:6333/dashboard)
      - "${QDRANT_GRPC_PORT:-6334}:6334" # gRPC (used by the service)
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The Qdrant image ships without curl; probe /readyz with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    image: ${RECOM_IMAGE:-recommendation-service:local}
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      QDRANT_URL: http://qdrant:6334
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      API_KEY: ${API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - recom-data:/data
      # Model cache. CI points this at a cached host directory.
      - ${MODELS_VOLUME:-recom-models}:/models
    healthcheck:
      test: ["CMD", "recommendation-service", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      # The first start downloads the embedding model (~450 MB for the default).
      start_period: 600s
      start_interval: 3s

volumes:
  qdrant-storage:
  recom-data:
  recom-models:
